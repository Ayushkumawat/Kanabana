name: kanabana

services:
  app:
    build: .
    image: kanabana:local
    ports:
      - "${PORT:-4050}:4050"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4050"
    volumes:
      - ./server/data/uploads:/app/server/data/uploads
    restart: unless-stopped

  mongo:
    profiles: ["local"]
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - kanabana-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    profiles: ["local"]
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --eval
      - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"

volumes:
  kanabana-mongo:
